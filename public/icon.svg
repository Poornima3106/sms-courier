<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F1D30" />
      <stop offset="100%" stop-color="#5B0E1B" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE899" />
      <stop offset="50%" stop-color="#E5B84B" />
      <stop offset="100%" stop-color="#C28A1A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Central Sweet Box & Diya Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Diya flame -->
    <path d="M 0,-110 C 18,-70 28,-40 0,0 C -28,-40 -18,-70 0,-110 Z" fill="#FFEAA0" />
    <path d="M 0,-90 C 10,-60 16,-40 0,-10 C -16,-40 -10,-60 0,-90 Z" fill="#FF8A00" />
    <!-- Diya base -->
    <path d="M -60,0 C -60,40 60,40 60,0 C 70,-15 -70,-15 -60,0 Z" fill="url(#gold)" />
    <!-- Diya pedestal -->
    <path d="M -25,32 L 25,32 L 35,50 L -35,50 Z" fill="url(#gold)" />
    
    <!-- Sweet Box Base Isometric -->
    <path d="M 0,70 L 140,110 L 0,150 L -140,110 Z" fill="url(#gold)" opacity="0.95" />
    <path d="M -140,110 L 0,150 L 0,200 L -140,160 Z" fill="#C28A1A" />
    <path d="M 0,150 L 140,110 L 140,160 L 0,200 Z" fill="#996B10" />
    
    <!-- Decorative sweets on tray -->
    <circle cx="-50" cy="110" r="14" fill="#FFF2B2" />
    <circle cx="0" cy="100" r="15" fill="#FFE17D" />
    <circle cx="50" cy="110" r="14" fill="#E59934" />
    <circle cx="-25" cy="125" r="13" fill="#D97706" />
    <circle cx="25" cy="125" r="13" fill="#FBBF24" />
  </g>

  <!-- Typography -->
  <text x="256" y="455" font-family="'Cinzel', 'Playfair Display', serif, system-ui" font-size="34" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="4">SMS COURIER</text>
  <text x="256" y="482" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E5B84B" text-anchor="middle" opacity="0.8" letter-spacing="3">SINCE 1946 • POLLACHI</text>
</svg>
